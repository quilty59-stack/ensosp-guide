<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#dc2626" />
    <meta
      name="description"
      content="Guide de poche de l'adjoint pédagogique conduite — plateau technique ENSOSP : fiche de tâches, sites, radio, organigramme, conduite à tenir en cas d'accident, motifs NEXIS."
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="AP COND" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Guide AP COND ENSOSP</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Applique le thème mémorisé avant le premier rendu : évite le flash de
      // fond clair au lancement de la PWA.
      (function () {
        try {
          var stored = localStorage.getItem('apcond:theme')
          var dark =
            stored === 'dark' ||
            (stored === null &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
